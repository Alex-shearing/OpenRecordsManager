# Sample nginx site for hosting the ORM static web client separately.
#
# Unpack orm-web-static-*.zip into /var/www/orm-web (or change root below).
# Point this server_name at your public UI hostname and terminate TLS as usual.
#
# Same-origin mode (recommended): proxy /api to the JAR.
# Cross-origin mode: omit the proxy block, patch apiBaseUrl in index.html (window.__ORM_UI__)
# to the public API URL, and allow that UI origin in APP_SECURITY_CORS_ALLOWED_ORIGINS.

server {
    listen 80;
    server_name orm.example.com;

    root /var/www/orm-web;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API (including centralised branding at /api/web) to the Spring Boot process
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
