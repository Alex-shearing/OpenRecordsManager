// Build the Svelte Frontend
tasks.register('buildWeb', Exec) {
    group = "build"

    inputs.dir file('src')
    inputs.file file('package.json')

    outputs.dir file('build')

    // Check OS to execute the proper npm command
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm install --legacy-peer-deps && npm run build'
    } else {
        commandLine 'sh', '-c', 'npm install --legacy-peer-deps && npm run build'
    }
}