services:
  api:
    build:
      context: .
      dockerfile: server-core/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - api-data:/app/data
      - api-logs:/app/logs
    environment:
      SERVER_DATABASE_PRIMARY_URL: jdbc:sqlite:/app/data/orm_system.db
      SERVER_DATABASE_READ_ONLY_URL: jdbc:sqlite:/app/data/orm_system.db
      SERVER_PLUGINS_DIRECTORY: /app/plugins
      SERVER_WEB_DIRECTORY: ""
      APP_LOGGING_PATH: /app/logs/openrecordsmanager.log
      APP_SECURITY_SECRET_KEY: change-me-in-production
      APP_SECURITY_COOKIE_SECURE: "false"
      APP_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      APP_SECURITY_CORS_ALLOWED_HEADERS: Authorization,Content-Type,X-XSRF-TOKEN,X-Client-Platform
      AUTH_AUTH_LOCAL_ENABLE_DEFAULT_ADMIN: "true"

  web:
    build:
      context: ./server-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      UI_API_BASE_URL: http://localhost:8080
      UI_PRODUCT_NAME: Open Records Manager
      UI_PRIMARY_COLOR: "#1d4ed8"
    depends_on:
      - api

volumes:
  api-data:
  api-logs:
