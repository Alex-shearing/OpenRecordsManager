services:
  api:
    build:
      context: .
      dockerfile: server-core/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - api-data:/app/data
    environment:
      SERVER_DATABASE_PRIMARY_URL: jdbc:sqlite:/app/data/orm_system.db?busy_timeout=5000
      SERVER_DATABASE_READ_ONLY_URL: jdbc:sqlite:/app/data/orm_system.db?open_mode=1
      SERVER_PLUGINS_DIRECTORY: /app/plugins
      SERVER_WEB_DIRECTORY: ""
      APP_LOGGING_PATH: /app/data/logs/openrecordsmanager.log

  web:
    build:
      context: ./server-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      UI_API_BASE_URL: http://localhost:8080
    depends_on:
      - api

volumes:
  api-data:
