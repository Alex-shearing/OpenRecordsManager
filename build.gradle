plugins {
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'java'
}

allprojects {
    group = 'com.openrecordsmanager'
    version = '0.1.0'

    repositories {
        mavenCentral()
    }
}

// Builds plugins and copies them to the server-core/plugin directory
tasks.register('copyPlugins', Copy) {
    group = "build"

    def pluginProjects = subprojects.findAll { it.path.startsWith(':plugins:') }

    // Ensure all plugin modules create their JARs first
    dependsOn pluginProjects.collect { it.tasks.named('jar') }

    // Harvest the actual built artifacts directly out of subproject compilation targets
    from pluginProjects.collect { it.tasks.named('jar').map { jarTask -> jarTask.outputs.files } }
    into file("${project(':server-core').projectDir}/plugins")
}

// Sync the website into the server
tasks.register('syncWebAssets', Sync) {
    group = "build"

    dependsOn project(':server-web').tasks.named('buildWeb')

    from project(':server-web').file('build')
    into project(':server-core').file('build/resources/main/static')
}

// Primary run task, including all dependencies
tasks.register('runApp') {
    group = "application"

    // Ensure all the dependencies are ran
    dependsOn tasks.named('copyPlugins')
    dependsOn tasks.named('syncWebAssets')

    // Wire the execution of bootRun
    dependsOn project(':server-core').tasks.named('bootRun')
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // Automatically inject Plugin headers into plugin jar files
    if (it.path.startsWith(':plugins:')) {
        tasks.named('jar', Jar) {
            manifest {
                attributes(
                        'Plugin-Id': project.name,
                        'Plugin-Version': project.version
                )
            }
        }
    }

    tasks.register('applyNullMarked') {
        group = 'formatting'
        description = 'Automatically injects JSpecify @NullMarked package-info.java files into all package trees.'

        // Pure declaration of input/output layouts ensures 100% compatibility with Configuration Caching
        def srcDir = file("src/main/java")
        inputs.dir(srcDir).optional()

        doLast {
            if (!srcDir.exists()) return

            srcDir.eachDirRecurse { dir ->
                // Look for directories that actually contain Java source files to avoid empty paths
                boolean hasJavaFiles = dir.listFiles().any { it.name.endsWith('.java') && it.name != 'package-info.java' }

                if (hasJavaFiles) {
                    // Reconstruct the package name based on the filesystem layout
                    def relativePath = srcDir.toPath().relativize(dir.toPath()).toString()
                    def packageName = relativePath.replace(File.separator, '.')

                    def packageInfoFile = new File(dir, 'package-info.java')

                    if (!packageInfoFile.exists()) {
                        packageInfoFile.text = """@NullMarked
package ${packageName};

import org.jspecify.annotations.NullMarked;
"""
                        logger.lifecycle("Created Missing Package Default: ${packageName}.package-info.java")
                    }
                }
            }
        }
    }
}
