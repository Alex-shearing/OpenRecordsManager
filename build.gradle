plugins {
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'java'
    id 'org.openrewrite.rewrite' version '7.36.0'
}

allprojects {
    group = 'com.openrecordsmanager'
    version = '0.1.0' // Replaces ${revision}

    repositories {
        mavenCentral()
    }
}

dependencies {
    rewrite 'org.openrewrite.recipe:rewrite-static-analysis:2.19.0'
}

// Inject compilation target and Manifest headers into all subprojects
subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    // Automatically inject Plugin headers into every built JAR file
    tasks.named('jar', Jar) {
        manifest {
            attributes(
                    'Plugin-Id': project.name,
                    'Plugin-Version': project.version
            )
        }
    }
}

tasks.register('applyNullMarked') {
    group = 'formatting'
    description = 'Automatically adds @NullMarked package-info.java files to all subpackages.'

    dependsOn 'rewriteRun'

    doFirst {
        rewrite {
            activeRecipe('org.openrewrite.java.search.AddNullMarkedToPackages')
        }
    }
}