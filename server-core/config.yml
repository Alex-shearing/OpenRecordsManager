#####################
# ORM Configuration #
#####################
# Precedence: Environment Variables > this file > Database / code defaults.

auth:
  auth_local:
    enable_default_admin: true

server:
  database:
    primary:
      url:
    read_only:
      url: jdbc:sqlite:orm_system.db
  plugins:
    directory: ./plugins
    skip_startup_check: false
  web:
    # Optional static SPA directory (e.g. ./static after unpacking orm-web-static-*.zip).
    # Leave empty when the UI is hosted separately (nginx/IIS/etc.).
    directory:

app:
  debug:
    detailed_errors: true
    show_sql: false
  security:
    expiration-time: 3600000
    cookie-name: ORM-Authentication
    cookie-secure: true
    cors:
      allowed-origins:
        - http://localhost:3000
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-XSRF-TOKEN
        - X-Client-Platform
  logging:
    level: INFO
    path: ./logs/openrecordsmanager.log
    rolling:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
      clean-history-on-start: false
