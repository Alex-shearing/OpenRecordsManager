#####################
# ORM Configuration #
#####################
# This configuration file contains the bare minimum to launch the application,
# all other configuration options will be loaded from the database/use defaults.

server:
  database:
    primary:
      url: jdbc:sqlite:./data/orm_system.db?busy_timeout=5000
  plugins:
    directory: ./plugins
  audit-directory: ./data/audit
  web-directory: ./static
