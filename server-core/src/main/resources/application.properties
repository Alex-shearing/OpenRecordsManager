# Spring Boot wiring only. Application settings live in ./config.yml
# (loaded from the process working directory). Env vars still override both.
spring.config.import=optional:file:./config.yml
# Map ORM settings onto Spring / logging properties (defaults apply if config.yml is absent)
spring.jpa.show-sql=${app.debug.show-sql:false}
logging.level.root=${server.logging.level:INFO}
logging.file.name=${server.logging.path:./logs/openrecordsmanager.log}
logging.logback.rollingpolicy.max-file-size=${server.logging.rolling.max-file-size:10MB}
logging.logback.rollingpolicy.max-history=${server.logging.rolling.max-history:7}
logging.logback.rollingpolicy.total-size-cap=${server.logging.rolling.total-size-cap:100MB}
logging.logback.rollingpolicy.clean-history-on-start=${server.logging.rolling.clean-history-on-start:false}
jakarta.persistence.schema-generation.database.action=none
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration/{vendor}
springdoc.swagger-ui.operationsSorter=alpha

# Actuator — health only under /api; probes for Docker/K8s
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoints.access.default=read-only
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
