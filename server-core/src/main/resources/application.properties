# Spring Boot wiring only. Application settings live in ./config.yml
# (loaded from the process working directory). Env vars still override both.
spring.config.import=optional:file:./config.yml
# Map ORM settings onto Spring / logging properties (defaults apply if config.yml is absent)
spring.jpa.show-sql=${app.debug.show_sql:false}
logging.level.root=${app.logging.level:INFO}
logging.file.name=${app.logging.path:./logs/openrecordsmanager.log}
logging.logback.rollingpolicy.max-file-size=${app.logging.rolling.max-file-size:10MB}
logging.logback.rollingpolicy.max-history=${app.logging.rolling.max-history:7}
logging.logback.rollingpolicy.total-size-cap=${app.logging.rolling.total-size-cap:100MB}
logging.logback.rollingpolicy.clean-history-on-start=${app.logging.rolling.clean-history-on-start:false}
jakarta.persistence.schema-generation.database.action=none
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration/{vendor}
springdoc.swagger-ui.operationsSorter=alpha
