# Import config.yml
spring.config.import=optional:classpath:config.yml
# Map nice properties to the internal ones
spring.jpa.show-sql=${server.debug.show_sql}
spring.datasource.url=${workgroup.database}
logging.level.root=${server.logging.level}
logging.file.name=${server.logging.path}
logging.logback.rollingpolicy.max-file-size=${server.logging.rolling.max-file-size}
logging.logback.rollingpolicy.max-history=${server.logging.rolling.max-history}
logging.logback.rollingpolicy.total-size-cap=${server.logging.rolling.total-size-cap}
logging.logback.rollingpolicy.clean-history-on-start=${server.logging.rolling.clean-history-on-start}
server.servlet.context-path=/api/v1
# Tell Hibernate to automatically update database schemas to match Java entities
jakarta.persistence.schema-generation.database.action=update
spring.jpa.hibernate.ddl-auto=update