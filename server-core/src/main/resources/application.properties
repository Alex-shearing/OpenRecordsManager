# Import config.yml
spring.config.import=optional:classpath:config.yml
# Map nice properties to the internal ones
spring.jpa.show-sql=${server.debug.show_sql}
spring.datasource.url=${workgroup.database}
logging.level.root=${server.logging.level}
server.servlet.context-path=/api/v1
# Tell Hibernate to automatically update database schemas to match Java entities
jakarta.persistence.schema-generation.database.action=update
spring.jpa.hibernate.ddl-auto=update