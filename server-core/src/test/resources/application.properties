# Prevent loading the developer's ./config.yml (would force ./data/orm_system.db).
spring.config.import=
spring.jpa.show-sql=true
# Named shared-memory DB — anonymous :memory: breaks under Hikari connection pooling.
server.database.primary.url=jdbc:sqlite:file:orm-test-default?mode=memory&cache=shared
server.database.primary.driver-class-name=org.sqlite.JDBC
server.database.read-only.url=
server.plugins.directory=./plugins
app.plugins.skip_sync=true
server.web.directory=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.jakarta.persistence.validation.mode=none
jakarta.persistence.schema-generation.database.action=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-on-validation-error=true
spring.flyway.validate-on-migrate=true
app.debug.detailed_errors=true
app.debug.show_sql=true
server.security.jwt-signing-key=orm-dev-only-change-me-in-production-32b
app.security.access-token-expiration-seconds=3600
app.security.degraded-access-token-expiration-seconds=900
app.security.refresh-token-expiration-seconds=604800
app.security.degraded-refresh-token-expiration-seconds=28800
app.security.cookie-auth.name=ORM-Authentication
app.security.cookie-auth.refresh-name=ORM-Refresh-Authentication
app.security.cookie-auth.secure=false
app.security.cors.allowed-origins=http://localhost:3000
app.security.cors.allowed-headers=Authorization,Content-Type,X-CSRF-TOKEN,X-Client-Platform,X-ORM-Audit-Comment
# Actuator smoke tests (override any defaults)
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoints.access.default=read-only
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
