spring.jpa.show-sql=true
server.database.primary.url=jdbc:h2:mem:orm_test;DB_CLOSE_DELAY=-1;MODE=mysql
server.database.primary.username=sa
server.database.primary.password=
server.database.primary.driver-class-name=org.h2.Driver
server.database.read-only.url=
server.plugins.directory=./plugins
server.plugins.skip_startup_check=true
server.web.directory=
spring.jpa.hibernate.ddl-auto=none
jakarta.persistence.schema-generation.database.action=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-on-validation-error=true
spring.flyway.validate-on-migrate=true
app.debug.detailed_errors=true
app.debug.show_sql=true
app.security.expiration-time=3600000
app.security.cookie-name=ORM-Authentication
app.security.cookie-secure=false
app.security.cors.allowed-origins=http://localhost:3000
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=Authorization,Content-Type,X-XSRF-TOKEN,X-Client-Platform,X-ORM-Audit-Comment
app.logging.level=INFO
app.logging.path=./logs/openrecordsmanager-test.log
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.h2=DEBUG
