# Tell Hibernate to automatically update database schemas to match Java entities
jakarta.persistence.schema-generation.database.action=update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Default to SQLite if no profile is explicitly passed
# spring.datasource.url=jdbc:sqlite:orm_system.db?open_mode=1
server.servlet.context-path=/api/v1
spring.jpa.properties.hibernate.connection.readOnly=false
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_HOLD
spring.datasource.hikari.read-only=false