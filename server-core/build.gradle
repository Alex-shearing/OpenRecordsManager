plugins {
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

sourceSets {
    test {
        resources {
            srcDir 'src/test/resources'
        }
    }
}

dependencies {
    // Plugin API
    implementation project(':plugin-api')

    // Spring Boot Starter packs (Versions managed by the boot plugin)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-sqlserver'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // JSON Web Tokens
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-impl:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // ORM Requirements
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:7.3.4.Final'

    // Engine requirements
    implementation 'org.semver4j:semver4j:6.0.0'
    implementation 'dev.cel:cel:0.13.1'

    // Database bundles
    runtimeOnly 'org.xerial:sqlite-jdbc:3.53.1.0'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11'
    runtimeOnly 'org.postgresql:postgresql:42.7.10'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.7'
}

testing {
    suites.configure {
        test {
            useJUnitJupiter '6.1.0'

            dependencies {
                implementation 'org.springframework.boot:spring-boot-starter-test'
                implementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
                implementation 'org.springframework.boot:spring-boot-testcontainers'
                implementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
                implementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
                implementation 'org.testcontainers:testcontainers-mariadb:2.0.5'
                implementation 'org.testcontainers:testcontainers-mssqlserver:2.0.5'
            }
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'database-migration'
    }
    dependsOn parent.tasks.named('copyPlugins')
}

tasks.register('databaseMigrationTest', Test) {
    group = 'verification'
    description = 'Runs Flyway migration integration tests for all supported database vendors'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'database-migration'
    }
    dependsOn parent.tasks.named('copyPlugins')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
