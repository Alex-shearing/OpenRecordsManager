plugins {
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

sourceSets {
    test {
        resources {
            srcDir 'src/test/resources'
        }
    }
}

dependencies {
    // Plugin API
    implementation project(':plugin-api')

    // Spring Boot Starter packs (Versions managed by the boot plugin)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // ORM Requirements
    implementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:7.3.4.Final'

    // Engine requirements
    implementation 'org.semver4j:semver4j:6.0.0'
    implementation 'dev.cel:cel:0.13.1'

    // Database bundles
    runtimeOnly 'org.xerial:sqlite-jdbc:3.53.1.0'
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11'
}

testing {
    suites.configure {
        test {
            useJUnitJupiter '6.1.0'

            dependencies {
                runtimeOnly 'com.h2database:h2'
                implementation 'org.springframework.boot:spring-boot-starter-test'
            }
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('test') {
    dependsOn parent.tasks.named('copyPlugins')
}
