name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

  web-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server-web/package-lock.json

      - name: Install dependencies
        working-directory: server-web
        run: npm ci --legacy-peer-deps

      - name: Run Svelte check
        working-directory: server-web
        run: npm run check

  build:
    runs-on: ubuntu-latest
    needs: [ test, web-check ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server-web/package-lock.json

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        run: ./gradlew distZip -Pversion=${{ steps.version.outputs.value }} --no-daemon

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/distributions/open-records-manager-${{ steps.version.outputs.value }}.zip
