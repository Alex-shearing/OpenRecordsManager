plugins {
    id 'java'
}

dependencies {
    compileOnly project(':plugin-api')

    implementation 'com.nimbusds:oauth2-oidc-sdk:11.37.2'

    testImplementation project(':plugin-api')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar', Jar) {
    from {
        configurations.runtimeClasspath
                .filter { file -> !file.path.contains("plugin-api") }
                .collect { file -> file.isDirectory() ? file : zipTree(file) }
    }

    // Ensure duplicates are safely handled during extraction merging
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
